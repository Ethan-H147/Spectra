name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore vcpkg dependencies
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 86dc619bd8d9697405ae5c944b474117ea9457ce
          doNotCache: false

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install portable application
        shell: pwsh
        run: >-
          cmake --install build --config Release
          --prefix "$env:GITHUB_WORKSPACE/dist/Spectra"

      - name: Create ZIP and checksum
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $label = $env:GITHUB_REF_NAME
          } else {
            $label = $env:GITHUB_SHA.Substring(0, 8)
          }
          $archiveName = "Spectra-$label-windows-x64.zip"
          $archivePath = Join-Path artifacts $archiveName
          Compress-Archive -Path dist/Spectra -DestinationPath $archivePath
          $hash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Encoding ascii "$archivePath.sha256"
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: spectra-windows-x64
          path: |
            artifacts/${{ steps.package.outputs.archive_name }}
            artifacts/${{ steps.package.outputs.archive_name }}.sha256
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: spectra-windows-x64
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Spectra ${GITHUB_REF_NAME}"
