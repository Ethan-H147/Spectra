name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-release
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-release
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore vcpkg dependencies
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 86dc619bd8d9697405ae5c944b474117ea9457ce
          doNotCache: true

      - name: Restore compiled dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-release-86dc619-${{ hashFiles('vcpkg.json', 'triplets/x64-windows-release.cmake') }}

      - name: Prepare compiled dependency cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force .vcpkg-binary-cache | Out-Null

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-release
          -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/triplets"
          -DSPECTRA_BUILD_COMMIT="$env:GITHUB_SHA"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install portable application
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: >-
          cmake --install build --config Release
          --prefix "$env:GITHUB_WORKSPACE/dist/Spectra"

      - name: Resolve package version
        if: github.event_name != 'pull_request'
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(SpectraDesktop VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read the project version from CMakeLists.txt"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
            }
            $label = $version
          } else {
            $label = "$version-$($env:GITHUB_SHA.Substring(0, 8))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT

      - name: Locate Inno Setup
        if: github.event_name != 'pull_request'
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --version=6.7.1 --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Could not install Inno Setup"
            }
            $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) {
            throw "Could not locate the Inno Setup compiler"
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Create release packages and checksums
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: >-
          ./packaging/package-windows.ps1
          -SourceDirectory dist/Spectra
          -ArtifactsDirectory artifacts
          -Version "${{ steps.version.outputs.version }}"
          -Label "${{ steps.version.outputs.label }}"
          -InnoCompiler "${{ steps.inno.outputs.compiler }}"

      - name: Upload Windows packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: spectra-windows-x64
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: spectra-windows-x64
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Spectra ${GITHUB_REF_NAME}"
